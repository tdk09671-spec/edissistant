# Quality gates: clean install, typecheck, build, unit tests and Electron end-to-end tests on Linux and
# Windows. See docs/CI.md for what runs where, what is skipped and why, and how to read a failure.
#
# Cost control: no job runs for draft pull requests (mark the PR "Ready for review" to run CI), a new
# push cancels the previous run of the same PR, and nothing here uses secrets, paid APIs, large
# downloads or GPU runners. No release, packaging or deployment happens in this workflow.

name: CI

on:
  pull_request:
    branches: [main, feature/end-to-end-integration]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

# Read-only token: the jobs only check out code and upload test reports.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  # Never prompt, never open a report viewer, keep npm quiet about funding/audit.
  CI: 'true'
  PLAYWRIGHT_HTML_OPEN: never
  npm_config_fund: 'false'
  npm_config_audit: 'false'

jobs:
  linux:
    name: Linux · typecheck, build, unit, Electron E2E
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      REPORTS: ci-reports
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      # FFmpeg (with libx264, prores_ks, aac and the flite filter) and FFprobe drive the real-media
      # tests; Inter is a brand font the pipeline E2E asks for; Xvfb gives Electron a display.
      # Electron's runtime libraries are listed so the job doesn't depend on what the image ships.
      - name: Install FFmpeg, fonts and Xvfb
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends \
            ffmpeg fonts-inter fonts-dejavu-core xvfb xauth \
            libnss3 libgbm1 libasound2t64 libgtk-3-0t64 libxss1

      - name: Set up Node (version from .nvmrc)
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Cache the Electron download
        uses: actions/cache@v4
        with:
          path: ~/.cache/electron
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Clean install (npm ci, exact versions from package-lock.json)
        run: npm ci

      - name: Check the test environment
        run: node scripts/ci/check-env.mjs --require-media --require-non-root

      - name: Typecheck
        run: npm run typecheck

      - name: Production build
        run: npm run build

      - name: Unit tests
        id: unit
        run: npx vitest run --reporter=default --reporter=json --outputFile.json="$REPORTS/vitest.json"

      - name: Unit tests · verify nothing unexpected was skipped
        if: ${{ !cancelled() && steps.unit.conclusion != 'skipped' }}
        run: node scripts/ci/verify-skips.mjs --vitest "$REPORTS/vitest.json" --os linux

      # Ubuntu 24.04 restricts unprivileged user namespaces (AppArmor), which Chromium's namespace
      # sandbox needs. The supported fallback is Chromium's setuid sandbox helper, which must be
      # owned by root with the setuid bit. This keeps Electron's sandbox ON; it does not use
      # --no-sandbox or relax the kernel setting for the whole machine.
      - name: Enable Electron's setuid sandbox helper
        if: ${{ !cancelled() && steps.unit.conclusion != 'skipped' }}
        run: |
          sudo chown root:root node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 node_modules/electron/dist/chrome-sandbox

      - name: Electron end-to-end tests
        id: e2e
        if: ${{ !cancelled() && steps.unit.conclusion != 'skipped' }}
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: ci-reports/playwright.json
        run: xvfb-run -a --server-args="-screen 0 1920x1080x24" npx playwright test --reporter=list,json,html

      - name: Electron E2E · verify nothing unexpected was skipped
        if: ${{ !cancelled() && steps.e2e.conclusion != 'skipped' }}
        run: node scripts/ci/verify-skips.mjs --playwright "$REPORTS/playwright.json" --os linux

      - name: Tests left no untracked files in tests/ or scripts/
        if: ${{ !cancelled() && steps.e2e.conclusion != 'skipped' }}
        run: node scripts/ci/check-tracked-fixtures.mjs

      - name: Upload test reports (on failure)
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-linux
          retention-days: 7
          if-no-files-found: ignore
          path: |
            playwright-report/
            test-results/
            ci-reports/
            !**/*.mp4
            !**/*.mov
            !**/*.mkv
            !**/*.webm
            !**/*.wav
            !**/*.mp3

  windows:
    name: Windows · typecheck, build, unit, Electron E2E
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: windows-2025
    timeout-minutes: 30
    env:
      REPORTS: ci-reports
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node (version from .nvmrc)
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Cache the Electron download
        uses: actions/cache@v4
        with:
          path: ~/AppData/Local/electron/Cache
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Clean install (npm ci, exact versions from package-lock.json)
        run: npm ci

      # Report only: FFmpeg isn't installed here, so the FFmpeg tests skip (allowed per file in
      # scripts/ci/allowed-skips.json) and run in the Linux job instead.
      - name: Check the test environment
        run: node scripts/ci/check-env.mjs

      - name: Typecheck
        run: npm run typecheck

      - name: Production build
        run: npm run build

      - name: Unit tests
        id: unit
        run: npx vitest run --reporter=default --reporter=json --outputFile.json="$REPORTS/vitest.json"

      - name: Unit tests · verify nothing unexpected was skipped
        if: ${{ !cancelled() && steps.unit.conclusion != 'skipped' }}
        run: node scripts/ci/verify-skips.mjs --vitest "$REPORTS/vitest.json" --os windows

      - name: Electron end-to-end tests
        id: e2e
        if: ${{ !cancelled() && steps.unit.conclusion != 'skipped' }}
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: ci-reports/playwright.json
        run: npx playwright test --reporter=list,json,html

      - name: Electron E2E · verify nothing unexpected was skipped
        if: ${{ !cancelled() && steps.e2e.conclusion != 'skipped' }}
        run: node scripts/ci/verify-skips.mjs --playwright "$REPORTS/playwright.json" --os windows

      - name: Tests left no untracked files in tests/ or scripts/
        if: ${{ !cancelled() && steps.e2e.conclusion != 'skipped' }}
        run: node scripts/ci/check-tracked-fixtures.mjs

      - name: Upload test reports (on failure)
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-windows
          retention-days: 7
          if-no-files-found: ignore
          path: |
            playwright-report/
            test-results/
            ci-reports/
            !**/*.mp4
            !**/*.mov
            !**/*.mkv
            !**/*.webm
            !**/*.wav
            !**/*.mp3

  # One check to require in branch protection, so the rule doesn't need updating when jobs change.
  ci-passed:
    name: CI passed
    if: ${{ always() && (github.event_name != 'pull_request' || github.event.pull_request.draft == false) }}
    needs: [linux, windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: All jobs succeeded
        env:
          LINUX: ${{ needs.linux.result }}
          WINDOWS: ${{ needs.windows.result }}
        run: |
          echo "linux: $LINUX, windows: $WINDOWS"
          test "$LINUX" = success && test "$WINDOWS" = success
