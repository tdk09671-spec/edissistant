<!doctype html><html><head><meta charset="utf-8">
<style>
@font-face{font-family:'Brand Display';src:url('../fonts/InterDisplay-ExtraBold.otf') format('opentype');font-weight:800}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1920px;height:1080px;overflow:hidden;background:radial-gradient(120% 90% at 50% 55%,#151513 0%,#0a0a09 60%,#050505 100%)}
.card{position:absolute;left:260px;top:300px;width:1400px;height:480px;border-radius:28px;background:#181818;border:1px solid rgba(255,255,255,.07);box-shadow:0 50px 140px rgba(0,0,0,.55)}
.kicker{position:absolute;left:96px;top:84px;font:800 26px 'Brand Display';letter-spacing:.14em;color:#9fd36e;text-transform:uppercase}
.head{position:absolute;left:92px;top:140px;font:800 150px/0.9 'Brand Display';letter-spacing:-.05em;color:#f7f7f2;white-space:nowrap}
.head em{font-style:normal;color:#fcff7b;text-shadow:0 0 28px rgba(252,255,123,.45)}
svg{position:absolute;right:110px;top:110px}
</style></head><body>
<div class="card">
  <div class="kicker">Synthetic design</div>
  <div class="head">Vector <em>sharp</em><br>at any scale</div>
  <svg width="260" height="260" viewBox="0 0 260 260"><defs><linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#fcff7b"/><stop offset="1" stop-color="#ff5a3c"/></linearGradient></defs>
    <circle cx="130" cy="130" r="112" fill="none" stroke="url(#g)" stroke-width="18" stroke-dasharray="560 140" stroke-linecap="round"/>
    <path d="M78 140 L118 178 L188 92" fill="none" stroke="#f7f7f2" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/></svg>
</div>
<div id="probe" style="position:absolute;left:1700px;top:960px;width:100px;height:60px;background:rgba(255,0,0,.5)"></div>
</body></html>
